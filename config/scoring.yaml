scale:
  aggregation: max
  missing: 0.3
  revenue_bands:
    - min: 15000000000
      value: 1.0
      label: "≥ 15 млрд ₽"
    - min: 5000000000
      value: 0.8
      label: "5–15 млрд ₽"
    - min: 1000000000
      value: 0.6
      label: "1–5 млрд ₽"
    - min: 300000000
      value: 0.4
      label: "0.3–1 млрд ₽"
    - min: 0
      value: 0.2
      label: "< 0.3 млрд ₽"
  employee_bands:
    - min: 251
      value: 1.0
      label: "> 250"
    - min: 101
      value: 0.8
      label: "101–250"
    - min: 16
      value: 0.5
      label: "16–100"
    - min: 0
      value: 0.2
      label: "< 15"

recency:
  half_life_days: 7
  max_age_days: 120
  missing: 0.5
  future: 1.0

roles:
  tie_break_tolerance: 0.03
  preferences:
