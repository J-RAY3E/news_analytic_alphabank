[project]
name = "alfa-radar"
version = "0.1.0"
description = "Alfa Radar - News to Impact to Action engine"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "openai>=1.50",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
